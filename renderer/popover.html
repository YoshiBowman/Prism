<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism</title>
  <style>
    @font-face { font-family: 'Archivo'; src: url('fonts/archivo-latin-variable.woff2') format('woff2-variations'); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; }
    @font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-latin-variable.woff2') format('woff2-variations'); font-weight: 100 800; font-display: block; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Archivo', -apple-system, system-ui, sans-serif;
      color: #E4E5E7;
      user-select: none;
      -webkit-app-region: no-drag;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      height: 195px;
    }
    button { font: inherit; cursor: default; }
    .popover {
      margin: 8px;
      padding: 16px;
      background: #16181B;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    .status-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4A4E55; flex-shrink: 0; margin-top: 6px; }
    .dot.running { background: #3FB950; }
    .status-info { flex: 1; min-width: 0; }
    .status-text { font-size: 15px; font-weight: 800; font-stretch: 108%; line-height: 1.3; }
    .protocol-hint {
      margin-top: 2px;
      font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      color: #A0A4AB;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn {
      flex: 1;
      height: 32px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .btn:disabled { opacity: 0.35; }
    .btn-start { background: #E4E5E7; border-color: #E4E5E7; color: #0F1012; }
    .btn-start:not(:disabled):hover { background: #FFFFFF; }
    .btn-stop { background: rgba(24, 26, 30, 0.9); color: #E4E5E7; }
    .btn-stop:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); }

    .divider { height: 1px; background: rgba(255, 255, 255, 0.09); margin-bottom: 12px; }

    .footer-row { display: flex; gap: 8px; }
    .btn-open, .btn-quit {
      height: 28px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-open { flex: 1; color: #E4E5E7; }
    .btn-open:hover { background: rgba(255, 255, 255, 0.08); }
    .btn-quit { padding: 0 14px; color: #A0A4AB; }
    .btn-quit:hover { background: #2A1515; color: #FF8A80; border-color: #4A2020; }
  </style>
</head>
<body>
  <div class="popover">

    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <div class="status-info">
        <div class="status-text" id="status-text">Stopped</div>
        <div class="protocol-hint" id="protocol-hint"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-start" id="btn-start">Start</button>
      <button class="btn btn-stop"  id="btn-stop" disabled>Stop</button>
    </div>

    <div class="divider"></div>

    <div class="footer-row">
      <button class="btn-open" id="btn-open">Open Prism</button>
      <button class="btn-quit" id="btn-quit">Quit</button>
    </div>

  </div>

  <script src="popover.js"></script>
</body>
</html>
